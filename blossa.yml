# Blossa configuration (example).
# Copy to blossa.local.yml for local credentials — blossa.local.yml is git-ignored.
# Every value can also be overridden by an environment variable (BLOSSA_*) or a CLI flag.

# --- Database connection (READ-ONLY) ---------------------------------------
oracle:
  # python-oracledb thin mode — no Oracle Instant Client required.
  # DSN forms: "host:port/service_name"  e.g. "localhost:1521/XEPDB1"
  dsn: "localhost:1521/XEPDB1"
  user: "blossa_demo"
  # Prefer the BLOSSA_ORACLE__PASSWORD env var over storing this in a file.
  password: "blossa_demo"
  # Schema (owner) to introspect. Defaults to the connecting user if omitted.
  schema: "BLOSSA_DEMO"

# --- LLM provider (semantic pass) ------------------------------------------
llm:
  # provider: "ollama" | "heuristic" | "openai_compatible"
  # "heuristic" runs fully offline with no model — useful for CI / a first run.
  provider: "ollama"
  # Language the map is WRITTEN in: table purposes, column meanings, program summaries.
  # "en" (default) or e.g. "ro". Table/column names and SQL are never translated. Applies to the
  # next scan; an existing map keeps the language it was written in. `ask` is separate — it
  # replies in whatever language the question was asked in.
  language: "en"
  # How many tables of the map one question may carry. Blossa sends only the tables a question
  # scores against, plus one join hop, and names the rest so the model can ask for them instead
  # of inventing their columns. A map smaller than this is sent whole. Raise it for a larger
  # model, lower it if answers wander to the wrong table.
  max_map_tables: 12
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:14b"
    # Hard timeout per request (seconds). Asking a question sends the whole schema map, so a
    # local model can take minutes on a large map — scanning is per-table and much quicker.
    timeout: 300
    # Ollama silently truncates a prompt that does not fit its context window, dropping the
    # schema map and leaving the model to invent tables. Blossa sizes the window per request;
    # this caps it. Raise for very large maps, lower on a memory-tight machine.
    max_context_tokens: 32768
  openai_compatible:
    base_url: "http://localhost:8000/v1"
    model: "local-model"
    # api_key via BLOSSA_LLM__OPENAI_COMPATIBLE__API_KEY if the endpoint needs one.
    api_key: ""
    timeout: 120

# --- Scan behaviour --------------------------------------------------------
scan:
  # Cap profiling work on very wide schemas (0 = no limit).
  max_tables: 0
  # Sample size per column for value-pattern / distinct-count profiling.
  sample_rows: 1000
  # Value-overlap threshold (0..1) for flagging an undeclared/candidate FK.
  candidate_fk_overlap: 0.85
  # Skip data profiling entirely (structure + comments only).
  skip_profiling: false

# --- Output ----------------------------------------------------------------
output:
  dir: "out"
  # Base filename (without extension) for the .md and .json artifacts.
  name: "database_map"
