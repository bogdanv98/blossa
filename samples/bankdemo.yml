# Config for scanning the BANKDEMO core-banking demo schema, including the end-of-day
# DBMS_SCHEDULER chain installed by bank_eod_chain.sql (see samples/README.md).
oracle:
  dsn: "localhost:1521/XEPDB1"
  user: "BANKDEMO"
  password: "oracle"
  schema: "BANKDEMO"

llm:
  # The real semantic pass. Swap to "heuristic" for a fast offline baseline.
  provider: "ollama"
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:14b"
    # This map is 17 tables; asking a question against it is a ~12k-token prompt, which a local
    # 14B model takes a couple of minutes to read. Scanning is per-table and much faster.
    timeout: 600

output:
  dir: "samples/out"
  name: "bankdemo_map"
